name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Derive version from tag
        run: |
          echo "GVI_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "GVI_VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Assemble signed release APK
        run: ./gradlew :app:assembleRelease
        env:
          GVI_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GVI_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          GVI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GVI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GVI_VERSION_NAME: ${{ env.GVI_VERSION_NAME }}
          GVI_VERSION_CODE: ${{ env.GVI_VERSION_CODE }}

      - name: Verify release signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Rename APK to a predictable asset name
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/gpt-voice-input-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/gpt-voice-input-*.apk
          name: GPT Voice Input ${{ github.ref_name }}
          generate_release_notes: true
