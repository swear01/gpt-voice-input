name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: GVI_VERSION_CODE is derived from the commit count
          # and must strictly increase across releases (shallow checkouts
          # would always count 1 and break seamless updates).
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Derive version from tag
        run: |
          echo "GVI_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "GVI_VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Android lint
        run: ./gradlew :app:lintDebug

      - name: Assemble signed release APK
        run: ./gradlew :app:assembleRelease
        env:
          GVI_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GVI_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          GVI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GVI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GVI_VERSION_NAME: ${{ env.GVI_VERSION_NAME }}
          GVI_VERSION_CODE: ${{ env.GVI_VERSION_CODE }}

      - name: Verify release signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Verify versionCode in APK
        run: |
          VC=$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging \
            app/build/outputs/apk/release/app-release.apk \
            | grep -o "versionCode='[0-9]*'" | head -1 | grep -o '[0-9]*')
          echo "APK versionCode=$VC expected=$GVI_VERSION_CODE"
          test "$VC" = "$GVI_VERSION_CODE"

      - name: Assert versionCode strictly increased since last release
        env:
          # gh CLI on hosted runners needs the token explicitly.
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/release-check-versioncode.sh \
            "${{ github.repository }}" \
            "${{ github.ref_name }}" \
            app/build/outputs/apk/release/app-release.apk \
            "$ANDROID_HOME/build-tools/35.0.0/aapt2"

      - name: Assert APK ships generic configuration only
        run: |
          JSONS=$(unzip -l app/build/outputs/apk/release/app-release.apk \
            | grep -oE 'assets/[^ ]*\.json' | sed 's|.*assets/||' | sort)
          echo "asset JSONs: $JSONS"
          # Structural check (term-free): the only bundled transcription
          # configuration must be the generic default.json.
          [ "$JSONS" = "default.json" ] \
            || { echo "ERROR: non-generic config assets present in APK"; exit 1; }

      - name: Rename APK to a predictable asset name
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/gpt-voice-input-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/gpt-voice-input-*.apk
          name: GPT Voice Input ${{ github.ref_name }}
          generate_release_notes: true
