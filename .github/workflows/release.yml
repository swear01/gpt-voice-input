name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional deployment profile: base64-encoded config/local.json content.
      # When absent, the APK ships with the generic default only.
      GVI_DEPLOYMENT_CONFIG_BASE64: ${{ secrets.GVI_DEPLOYMENT_CONFIG_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: GVI_VERSION_CODE is derived from the commit count
          # and must strictly increase across releases (shallow checkouts
          # would always count 1 and break seamless updates).
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Inject deployment profile (optional)
        run: |
          if [ -n "$GVI_DEPLOYMENT_CONFIG_BASE64" ]; then
            echo "$GVI_DEPLOYMENT_CONFIG_BASE64" | base64 -d > config/local.json
            python3 -m json.tool config/local.json > /dev/null
            echo "Deployment profile injected and JSON-validated."
          else
            echo "No deployment profile secret — building with generic default only."
          fi

      - name: Derive version from tag
        run: |
          echo "GVI_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "GVI_VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Android lint
        run: ./gradlew :app:lintDebug

      - name: Assemble signed release APK
        run: ./gradlew :app:assembleRelease
        env:
          GVI_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GVI_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          GVI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GVI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GVI_VERSION_NAME: ${{ env.GVI_VERSION_NAME }}
          GVI_VERSION_CODE: ${{ env.GVI_VERSION_CODE }}

      - name: Verify release signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Verify versionCode in APK
        run: |
          VC=$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging \
            app/build/outputs/apk/release/app-release.apk \
            | grep -o "versionCode='[0-9]*'" | head -1 | grep -o '[0-9]*')
          echo "APK versionCode=$VC expected=$GVI_VERSION_CODE"
          test "$VC" = "$GVI_VERSION_CODE"

      - name: Assert versionCode strictly increased since last release
        run: |
          NEW_VC=$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging \
            app/build/outputs/apk/release/app-release.apk \
            | grep -o "versionCode='[0-9]*'" | head -1 | grep -o '[0-9]*')
          echo "new versionCode=$NEW_VC"
          if gh release view latest --repo "${{ github.repository }}" --json tagName > /dev/null 2>&1; then
            rm -rf /tmp/prev && mkdir -p /tmp/prev
            gh release download latest --repo "${{ github.repository }}" \
              --pattern '*.apk' -D /tmp/prev > /dev/null 2>&1 || {
                echo "no previous APK asset; skipping check"; exit 0
              }
            PREV_APK=$(ls /tmp/prev/*.apk 2>/dev/null | head -1)
            [ -n "$PREV_APK" ] || { echo "no previous APK asset; skipping check"; exit 0; }
            OLD_VC=$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$PREV_APK" \
              | grep -o "versionCode='[0-9]*'" | head -1 | grep -o '[0-9]*')
            echo "previous release versionCode=$OLD_VC"
            test "$NEW_VC" -gt "$OLD_VC" \
              || { echo "versionCode did not increase ($NEW_VC <= $OLD_VC)"; exit 1; }
          else
            echo "no previous release; this is the first one"
          fi

      - name: Verify deployment profile asset in APK
        if: env.GVI_DEPLOYMENT_CONFIG_BASE64 != ''
        run: |
          unzip -l app/build/outputs/apk/release/app-release.apk | grep "assets/local.json"

      - name: Rename APK to a predictable asset name
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/gpt-voice-input-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/gpt-voice-input-*.apk
          name: GPT Voice Input ${{ github.ref_name }}
          generate_release_notes: true
